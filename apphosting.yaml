# Firebase App Hosting configuration for the Next.js app.
# Secrets live in Cloud Secret Manager and are set with:
#   firebase apphosting:secrets:set <name>
# Nothing secret is committed here.

runConfig:
  minInstances: 0
  # A demo: one small instance is plenty, and it caps what a busy day can cost.
  maxInstances: 1
  memoryMiB: 1024

env:
  - variable: PAYPAL_CLIENT_ID
    secret: paypal-client-id
  - variable: PAYPAL_SECRET
    secret: paypal-secret
  - variable: AG_STUDIO_OPENAI_API_KEY
    secret: openai-api-key
  # Gates every page and API route behind HTTP Basic auth (see proxy.ts).
  - variable: DEMO_PASSWORD
    secret: demo-password
  - variable: OPENAI_MODELS
    value: gpt-5.6-terra,gpt-5.6-luna,gpt-5.6-sol
  - variable: AG_STUDIO
    secret: ag-studio-licence
